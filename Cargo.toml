[package]
name = "dungeon_manager"
version = "0.1.0"
edition = "2021"
authors = ["Deep Dominion Team"]
default-run = "dungeon_manager"
build = "build.rs"

[dependencies]
macroquad = "=0.4.16"
macroquad-toolkit = { path = "../macroquad-toolkit" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = "0.24"

[target.'cfg(target_arch = "wasm32")'.dependencies]
sapp-jsutils = "0.1"

[[bin]]
name = "dungeon_manager"
path = "src/main.rs"

[[bin]]
name = "build_graphics"
path = "build_graphics.rs"

[[bin]]
name = "balance_calculator"
path = "src/bin/balance_calculator/main.rs"
